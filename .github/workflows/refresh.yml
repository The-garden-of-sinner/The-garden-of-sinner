name: Refresh Profile

on:
  schedule:
    # 每天 UTC 00:17（北京时间 08:17）刷新一次
    - cron: '17 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# 防止定时任务与手动触发同时运行导致 push 冲突
concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh stars and contribution heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_profile.py

      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -n "$(git status --porcelain -- README.md README.zh-CN.md assets/heatmap.svg)" ]; then
            git add README.md README.zh-CN.md assets/heatmap.svg
            git commit -m 'chore: refresh stars and contribution heatmap'
            # 显式推 HEAD 到当前分支，避免 detached HEAD 场景推送失败
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo 'No changes.'
          fi
