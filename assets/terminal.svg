<svg xmlns="http://www.w3.org/2000/svg" width="760" height="306" viewBox="0 0 760 306" fill="none">
  <style>
    .term-font {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      font-size: 13.5px;
    }
    .title-font {
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
      font-size: 12px;
    }

    /* 14s full cycle: execute line-by-line -> idle read -> clear screen -> reset */
    .screen {
      animation: screenCycle 14s linear infinite;
    }
    @keyframes screenCycle {
      0%, 88% { opacity: 1; }
      90%, 100% { opacity: 0; }
    }

    /* Typewriter clipPath reveal animations */
    .rw1 { animation: reveal1 14s steps(17, end) infinite; }
    @keyframes reveal1 {
      0%, 3% { width: 0px; }
      12%, 100% { width: 138px; }
    }
    .rw2 { animation: reveal2 14s steps(26, end) infinite; }
    @keyframes reveal2 {
      0%, 20% { width: 0px; }
      33%, 100% { width: 211px; }
    }
    .rw3 { animation: reveal3 14s steps(5, end) infinite; }
    @keyframes reveal3 {
      0%, 81.5% { width: 0px; }
      86.5%, 100% { width: 41px; }
    }

    /* Synchronized tracking cursor across all 3 command lines */
    .cursor-track {
      animation: moveCursor 14s step-end infinite;
    }
    @keyframes moveCursor {
      0%, 2.99% {
        opacity: 1;
        transform: translate(40px, 55px);
        animation-timing-function: steps(17, end);
      }
      3% {
        opacity: 1;
        transform: translate(40px, 55px);
        animation-timing-function: steps(17, end);
      }
      12% {
        opacity: 1;
        transform: translate(178px, 55px);
        animation-timing-function: step-end;
      }
      13.5% {
        opacity: 0;
        transform: translate(40px, 139px);
        animation-timing-function: step-end;
      }
      18.5%, 19.99% {
        opacity: 1;
        transform: translate(40px, 139px);
        animation-timing-function: steps(26, end);
      }
      20% {
        opacity: 1;
        transform: translate(40px, 139px);
        animation-timing-function: steps(26, end);
      }
      33% {
        opacity: 1;
        transform: translate(251px, 139px);
        animation-timing-function: step-end;
      }
      34.5% {
        opacity: 0;
        transform: translate(40px, 249px);
        animation-timing-function: step-end;
      }
      41.5%, 81.49% {
        opacity: 1;
        transform: translate(40px, 249px);
        animation-timing-function: steps(5, end);
      }
      81.5% {
        opacity: 1;
        transform: translate(40px, 249px);
        animation-timing-function: steps(5, end);
      }
      86.5%, 100% {
        opacity: 1;
        transform: translate(81px, 249px);
      }
    }

    /* Solid while typing, 1Hz blink while waiting at prompt 3 */
    .cursor-blink {
      animation: blinkIdle 14s step-end infinite;
    }
    @keyframes blinkIdle {
      0%, 44.99% { opacity: 1; }
      45%, 48.49% { opacity: 0; }
      48.5%, 51.99% { opacity: 1; }
      52%, 55.49% { opacity: 0; }
      55.5%, 58.99% { opacity: 1; }
      59%, 62.49% { opacity: 0; }
      62.5%, 65.99% { opacity: 1; }
      66%, 69.49% { opacity: 0; }
      69.5%, 72.99% { opacity: 1; }
      73%, 76.49% { opacity: 0; }
      76.5%, 79.99% { opacity: 1; }
      80%, 81.49% { opacity: 0; }
      81.5%, 100% { opacity: 1; }
    }

    /* Output 1 lines */
    .out1a { opacity: 0; animation: showOut1a 14s step-end infinite; }
    @keyframes showOut1a { 0%, 13.5% { opacity: 0; } 14%, 100% { opacity: 1; } }

    .out1b { opacity: 0; animation: showOut1b 14s step-end infinite; }
    @keyframes showOut1b { 0%, 15% { opacity: 0; } 15.5%, 100% { opacity: 1; } }

    /* Prompt 2 */
    .prompt2 { opacity: 0; animation: showPrompt2 14s step-end infinite; }
    @keyframes showPrompt2 { 0%, 18% { opacity: 0; } 18.5%, 100% { opacity: 1; } }

    /* Output 2 (TOML) lines */
    .out2a { opacity: 0; animation: showOut2a 14s step-end infinite; }
    @keyframes showOut2a { 0%, 34.5% { opacity: 0; } 35%, 100% { opacity: 1; } }

    .out2b { opacity: 0; animation: showOut2b 14s step-end infinite; }
    @keyframes showOut2b { 0%, 36.5% { opacity: 0; } 37%, 100% { opacity: 1; } }

    .out2c { opacity: 0; animation: showOut2c 14s step-end infinite; }
    @keyframes showOut2c { 0%, 38.5% { opacity: 0; } 39%, 100% { opacity: 1; } }

    /* Prompt 3 */
    .prompt3 { opacity: 0; animation: showPrompt3 14s step-end infinite; }
    @keyframes showPrompt3 { 0%, 41% { opacity: 0; } 41.5%, 100% { opacity: 1; } }
  </style>

  <defs>
    <clipPath id="type1"><rect class="rw1" x="40" y="54" width="0" height="22" /></clipPath>
    <clipPath id="type2"><rect class="rw2" x="40" y="138" width="0" height="22" /></clipPath>
    <clipPath id="type3"><rect class="rw3" x="40" y="248" width="0" height="22" /></clipPath>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="0.5" y="0.5" width="759" height="305" rx="12" fill="#0D1117" stroke="#30363D" />

  <!-- Title Bar -->
  <path d="M1 12.5C1 6.14873 6.14873 1 12.5 1H747.5C753.851 1 759 6.14873 759 12.5V38H1V12.5Z" fill="#161B22" />
  <line x1="1" y1="38" x2="759" y2="38" stroke="#30363D" />

  <!-- Window Controls -->
  <circle cx="22" cy="19.5" r="5.5" fill="#FF5F56" />
  <circle cx="42" cy="19.5" r="5.5" fill="#FFBD2E" />
  <circle cx="62" cy="19.5" r="5.5" fill="#27C93F" />

  <!-- Window Title -->
  <text x="380" y="23.5" text-anchor="middle" fill="#8B949E" class="title-font">observer@ustc: ~ (zsh)</text>

  <!-- Terminal Screen Content -->
  <g class="screen">
    <!-- Line 1: Prompt + whoami observer flag -->
    <text x="24" y="68" class="term-font" font-weight="bold" fill="#38BDF8">❯</text>
    <text x="40" y="68" class="term-font" clip-path="url(#type1)">
      <tspan fill="#E6EDF3">whoami </tspan><tspan fill="#79C0FF">--observer</tspan>
    </text>

    <!-- Lines 2-3: whoami output -->
    <g class="out1a">
      <text x="24" y="94" class="term-font">
        <tspan fill="#8B949E">  handle   </tspan><tspan fill="#484F58">:: </tspan><tspan fill="#7EE787">The-garden-of-sinner</tspan><tspan fill="#8B949E"> (USTC CS)</tspan>
      </text>
    </g>
    <g class="out1b">
      <text x="24" y="118" class="term-font">
        <tspan fill="#8B949E">  axiom    </tspan><tspan fill="#484F58">:: </tspan><tspan fill="#D2A8FF">Observer of code, entropy &amp; silicon.</tspan>
      </text>
    </g>

    <!-- Line 4: Prompt + cat ~/.config/profile.toml -->
    <g class="prompt2">
      <text x="24" y="152" class="term-font" font-weight="bold" fill="#38BDF8">❯</text>
    </g>
    <text x="40" y="152" class="term-font" clip-path="url(#type2)">
      <tspan fill="#E6EDF3">cat </tspan><tspan fill="#FFA657">~/.config/profile.toml</tspan>
    </text>

    <!-- Lines 5-7: profile.toml syntax-highlighted output -->
    <g class="out2a">
      <text x="24" y="178" class="term-font">
        <tspan fill="#FF7B72">  [system] </tspan><tspan fill="#79C0FF">os</tspan><tspan fill="#8B949E"> = </tspan><tspan fill="#A5D6FF">["Linux", "KylinOS"]</tspan><tspan fill="#79C0FF">  lang</tspan><tspan fill="#8B949E"> = </tspan><tspan fill="#A5D6FF">["Python", "C/C++", "Shell"]</tspan>
      </text>
    </g>
    <g class="out2b">
      <text x="24" y="202" class="term-font">
        <tspan fill="#FF7B72">  [models] </tspan><tspan fill="#79C0FF">drivers</tspan><tspan fill="#8B949E"> = </tspan><tspan fill="#38BDF8" font-weight="bold">["DeepSeek", "Gemini"]</tspan><tspan fill="#79C0FF">  local</tspan><tspan fill="#8B949E"> = </tspan><tspan fill="#A5D6FF">["Ollama", "PyTorch"]</tspan>
      </text>
    </g>
    <g class="out2c">
      <text x="24" y="226" class="term-font">
        <tspan fill="#FF7B72">  [focus]  </tspan><tspan fill="#7EE787">"Token telemetry"</tspan><tspan fill="#484F58"> · </tspan><tspan fill="#7EE787">"Prefix-Cache"</tspan><tspan fill="#484F58"> · </tspan><tspan fill="#7EE787">"Cross-domain RecSys"</tspan>
      </text>
    </g>

    <!-- Line 8: Idle prompt + clear command -->
    <g class="prompt3">
      <text x="24" y="262" class="term-font" font-weight="bold" fill="#38BDF8">❯</text>
    </g>
    <text x="40" y="262" class="term-font" fill="#E6EDF3" clip-path="url(#type3)">clear</text>

    <!-- Synchronized Tracking Block Cursor -->
    <g class="cursor-track">
      <rect width="7.5" height="15" rx="1" fill="#38BDF8" class="cursor-blink" />
    </g>
  </g>
</svg>