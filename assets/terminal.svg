<svg xmlns="http://www.w3.org/2000/svg" width="760" height="306" viewBox="0 0 760 306" fill="none">
  <style>
    .term-font {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      font-size: 13.5px;
    }
    .title-font {
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
      font-size: 12px;
    }

    /* 14s full cycle: execute line-by-line -> idle read -> clear screen -> reset */
    .screen {
      animation: screenCycle 14s linear infinite;
    }
    @keyframes screenCycle {
      0%, 88% { opacity: 1; }
      90%, 100% { opacity: 0; }
    }

    /* Typewriter clipPath reveal animations */
    .rw1 { animation: reveal1 14s steps(17, end) infinite; }
    @keyframes reveal1 {
      0%, 3% { width: 0px; }
      12%, 100% { width: 138px; }
    }
    .rw2 { animation: reveal2 14s steps(26, end) infinite; }
    @keyframes reveal2 {
      0%, 20% { width: 0px; }
      33%, 100% { width: 211px; }
    }
    .rw3 { animation: reveal3 14s steps(5, end) infinite; }
    @keyframes reveal3 {
      0%, 81.5% { width: 0px; }
      86.5%, 100% { width: 41px; }
    }

    /* Synchronized tracking cursor across all 3 command lines */
    .cursor-track {
      animation: moveCursor 14s step-end infinite;
    }
    @keyframes moveCursor {
      0%, 2.99% {
        opacity: 1;
        transform: translate(40px, 55px);
        animation-timing-function: steps(17, end);
      }
      3% {
        opacity: 1;
        transform: translate(40px, 55px);
        animation-timing-function: steps(17, end);
      }
      12% {
        opacity: 1;
        transform: translate(178px, 55px);
        animation-timing-function: step-end;
      }
      13.5% {
        opacity: 0;
        transform: translate(40px, 139px);
        animation-timing-function: step-end;
      }
      18.5%, 19.99% {
        opacity: 1;
        transform: translate(40px, 139px);
        animation-timing-function: steps(26, end);
      }
      20% {
        opacity: 1;
        transform: translate(40px, 139px);
        animation-timing-function: steps(26, end);
      }
      33% {
        opacity: 1;
        transform: translate(251px, 139px);
        animation-timing-function: step-end;
      }
      34.5% {
        opacity: 0;
        transform: translate(40px, 249px);
        animation-timing-function: step-end;
      }
      41.5%, 81.49% {
        opacity: 1;
        transform: translate(40px, 249px);
        animation-timing-function: steps(5, end);
      }
      81.5% {
        opacity: 1;
        transform: translate(40px, 249px);
        animation-timing-function: steps(5, end);
      }
      86.5%, 100% {
        opacity: 1;
        transform: translate(81px, 249px);
      }
    }

    /* Solid while typing, 1Hz blink while waiting at prompt 3 */
    .cursor-blink {
      animation: blinkIdle 14s step-end infinite;
    }
    @keyframes blinkIdle {
      0%, 44.99% { opacity: 1; }
      45%, 48.49% { opacity: 0; }
      48.5%, 51.99% { opacity: 1; }
      52%, 55.49% { opacity: 0; }
      55.5%, 58.99% { opacity: 1; }
      59%, 62.49% { opacity: 0; }
      62.5%, 65.99% { opacity: 1; }
      66%, 69.49% { opacity: 0; }
      69.5%, 72.99% { opacity: 1; }
      73%, 76.49% { opacity: 0; }
      76.5%, 79.99% { opacity: 1; }
      80%, 81.49% { opacity: 0; }
      81.5%, 100% { opacity: 1; }
    }

    /* Output 1 lines */
    .out1a { opacity: 0; animation: showOut1a 14s step-end infinite; }
    @keyframes showOut1a { 0%, 13.5% { opacity: 0; } 14%, 100% { opacity: 1; } }

    .out1b { opacity: 0; animation: showOut1b 14s step-end infinite; }
    @keyframes showOut1b { 0%, 15% { opacity: 0; } 15.5%, 100% { opacity: 1; } }

    /* Prompt 2 */
    .prompt2 { opacity: 0; animation: showPrompt2 14s step-end infinite; }
    @keyframes showPrompt2 { 0%, 18% { opacity: 0; } 18.5%, 100% { opacity: 1; } }

    /* Output 2 (TOML) lines */
    .out2a { opacity: 0; animation: showOut2a 14s step-end infinite; }
    @keyframes showOut2a { 0%, 34.5% { opacity: 0; } 35%, 100% { opacity: 1; } }

    .out2b { opacity: 0; animation: showOut2b 14s step-end infinite; }
    @keyframes showOut2b { 0%, 36.5% { opacity: 0; } 37%, 100% { opacity: 1; } }

    .out2c { opacity: 0; animation: showOut2c 14s step-end infinite; }
    @keyframes showOut2c { 0%, 38.5% { opacity: 0; } 39%, 100% { opacity: 1; } }

    /* Prompt 3 */
    .prompt3 { opacity: 0; animation: showPrompt3 14s step-end infinite; }
    @keyframes showPrompt3 { 0%, 41% { opacity: 0; } 41.5%, 100% { opacity: 1; } }
    /* Inline brand marks: independent loops, isolated from 14s master timeline */
    .logo-ds { animation: dsFloat 2.8s ease-in-out infinite; transform-origin: 0 0; }
    @keyframes dsFloat {
      0%, 100% { transform: translateY(-1.2px) rotate(-3deg); }
      50%      { transform: translateY(1.2px) rotate(3deg); }
    }
    .logo-gm { animation: gmBreathe 2.4s ease-in-out infinite; transform-origin: 0 0; }
    @keyframes gmBreathe {
      0%, 100% { transform: scale(.92) rotate(-2deg); opacity: .82; }
      50%      { transform: scale(1.08) rotate(2deg); opacity: 1; }
    }
  </style>

  <defs>
    <clipPath id="type1"><rect class="rw1" x="40" y="54" width="0" height="22" /></clipPath>
    <clipPath id="type2"><rect class="rw2" x="40" y="138" width="0" height="22" /></clipPath>
    <clipPath id="type3"><rect class="rw3" x="40" y="248" width="0" height="22" /></clipPath>

    <linearGradient gradientUnits="userSpaceOnUse" x1="7" x2="11" y1="15.5" y2="12" id="gm-grad-green"><stop stop-color="#08B962"/><stop offset="1" stop-color="#08B962" stop-opacity="0"/></linearGradient>
    <linearGradient gradientUnits="userSpaceOnUse" x1="8" x2="11.5" y1="5.5" y2="11" id="gm-grad-red"><stop stop-color="#F94543"/><stop offset="1" stop-color="#F94543" stop-opacity="0"/></linearGradient>
    <linearGradient gradientUnits="userSpaceOnUse" x1="3.5" x2="17.5" y1="13.5" y2="12" id="gm-grad-yellow"><stop stop-color="#FABC12"/><stop offset=".46" stop-color="#FABC12" stop-opacity="0"/></linearGradient>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="0.5" y="0.5" width="759" height="305" rx="12" fill="#0D1117" stroke="#30363D" />

  <!-- Title Bar -->
  <path d="M1 12.5C1 6.14873 6.14873 1 12.5 1H747.5C753.851 1 759 6.14873 759 12.5V38H1V12.5Z" fill="#161B22" />
  <line x1="1" y1="38" x2="759" y2="38" stroke="#30363D" />

  <!-- Window Controls -->
  <circle cx="22" cy="19.5" r="5.5" fill="#FF5F56" />
  <circle cx="42" cy="19.5" r="5.5" fill="#FFBD2E" />
  <circle cx="62" cy="19.5" r="5.5" fill="#27C93F" />

  <!-- Window Title -->
  <text x="380" y="23.5" text-anchor="middle" fill="#8B949E" class="title-font">observer@ustc: ~ (zsh)</text>

  <!-- Terminal Screen Content -->
  <g class="screen">
    <!-- Line 1: Prompt + whoami observer flag -->
    <text x="24" y="68" class="term-font" font-weight="bold" fill="#38BDF8">❯</text>
    <text x="40" y="68" class="term-font" clip-path="url(#type1)">
      <tspan fill="#E6EDF3">whoami </tspan><tspan fill="#79C0FF">--observer</tspan>
    </text>

    <!-- Lines 2-3: whoami output -->
    <g class="out1a">
      <text x="24" y="94" class="term-font">
        <tspan fill="#8B949E">  handle   </tspan><tspan fill="#484F58">:: </tspan><tspan fill="#7EE787">The-garden-of-sinner</tspan><tspan fill="#484F58"> / </tspan><tspan fill="#E3B341">大晋帝国之谶</tspan>
      </text>
    </g>
    <g class="out1b">
      <text x="24" y="118" class="term-font">
        <tspan fill="#8B949E">  axiom    </tspan><tspan fill="#484F58">:: </tspan><tspan fill="#D2A8FF">Observer of code, entropy &amp; silicon.</tspan>
      </text>
    </g>

    <!-- Line 4: Prompt + cat ~/.config/profile.toml -->
    <g class="prompt2">
      <text x="24" y="152" class="term-font" font-weight="bold" fill="#38BDF8">❯</text>
    </g>
    <text x="40" y="152" class="term-font" clip-path="url(#type2)">
      <tspan fill="#E6EDF3">cat </tspan><tspan fill="#FFA657">~/.config/profile.toml</tspan>
    </text>

    <!-- Lines 5-7: profile.toml syntax-highlighted output -->
    <g class="out2a">
      <text x="24" y="178" class="term-font">
        <tspan fill="#FF7B72">  [system] </tspan><tspan fill="#79C0FF">os</tspan><tspan fill="#8B949E"> = </tspan><tspan fill="#A5D6FF">["Linux", "KylinOS"]</tspan><tspan fill="#79C0FF">  lang</tspan><tspan fill="#8B949E"> = </tspan><tspan fill="#A5D6FF">["Python", "C/C++", "Shell"]</tspan>
      </text>
    </g>
    <g class="out2b">
      <text x="24" y="202" class="term-font"><tspan fill="#FF7B72">[models] </tspan><tspan fill="#79C0FF">cloud</tspan><tspan fill="#8B949E"> = </tspan><tspan fill="#A5D6FF">[</tspan></text>
      <g transform="translate(180.41 197.20)"><g class="logo-ds"><g transform="translate(-6.75 -6.75) scale(.5625)"><path d="M23.75 4.48c-.25-.12-.36 .11-.51 .23-.05 .04-.09 .09-.14 .14-.37 .4-.81 .66-1.37 .63-.83-.05-1.54 .21-2.16 .85-.13-.78-.57-1.25-1.25-1.55-.35-.16-.71-.31-.95-.65-.17-.24-.22-.51-.3-.77-.06-.16-.11-.32-.29-.35-.2-.03-.28 .14-.36 .28-.31 .57-.43 1.2-.42 1.84 .03 1.44 .63 2.58 1.84 3.39 .14 .09 .17 .19 .13 .32-.08 .28-.18 .55-.27 .83-.06 .18-.14 .22-.33 .14a5.53 5.53 0 0 1-1.74-1.18c-.86-.83-1.63-1.74-2.6-2.46a11.37 11.37 0 0 0-.69-.47c-.98-.96 .13-1.74 .39-1.84 .27-.1 .09-.43-.78-.43-.87 0-1.67 .29-2.69 .68a3.06 3.06 0 0 1-.47 .14 9.6 9.6 0 0 0-2.88-.1c-1.89 .21-3.39 1.1-4.5 2.62C.08 8.61-.23 10.68 .15 12.85c.4 2.28 1.57 4.17 3.36 5.65 1.86 1.53 4 2.28 6.44 2.14 1.48-.09 3.13-.28 4.99-1.86 .47 .23 .96 .33 1.78 .4 .63 .06 1.24-.03 1.71-.13 .73-.16 .68-.84 .42-.96-2.15-1-1.68-.59-2.11-.93 1.1-1.3 2.75-2.64 3.39-7 .05-.35 .01-.56 0-.84-0-.17 .04-.24 .23-.26a4.17 4.17 0 0 0 1 .55-.47c1.4-.76 1.96-2.02 2.09-3.52 .02-.23-0-.47-.25-.59zM11.58 18c-2.09-1.64-3.1-2.18-3.52-2.16-.39 .02-.32 .47-.23 .76 .09 .29 .21 .49 .37 .74 .11 .17 .19 .42-.11 .6-.67 .42-1.84-.14-1.9-.17-1.36-.8-2.5-1.86-3.3-3.31-.77-1.39-1.22-2.89-1.3-4.48-.02-.39 .09-.52 .48-.59a4.7 4.7 0 0 1 1 .53-.04c2.13 .31 3.95 1.26 5.47 2.77 .87 .86 1.52 1.89 2.2 2.89 .72 1.07 1.49 2.08 2.48 2.91 .35 .29 .62 .51 .89 .68-.8 .09-2.14 .11-3.05-.61zm1-6.44a.31 .31 0 0 1 .41-.29 .3 .3 0 0 1 .2 .29 .31 .31 0 0 1-.31 .31 .3 .3 0 0 1-.3-.31zm3.11 1.6c-.2 .08-.4 .15-.59 .16a1.25 1.25 0 0 1-.8-.25c-.27-.23-.47-.36-.55-.76a1.73 1.73 0 0 1 .02-.59c.07-.33-.01-.54-.24-.73-.19-.16-.43-.2-.69-.2a.56 .56 0 0 1-.25-.08c-.11-.05-.2-.19-.11-.36 .03-.05 .16-.19 .19-.21 .36-.2 .77-.14 1.15 .02 .35 .14 .62 .41 1 .78 .39 .45 .46 .58 .69 .91 .18 .27 .34 .54 .45 .85 .07 .2-.02 .35-.25 .45z" fill="#4D6BFE"/></g></g></g>
      <text x="190.66" y="202" class="term-font"><tspan fill="#38BDF8" font-weight="bold">"DeepSeek",</tspan></text>
      <g transform="translate(290.23 197.20)"><g class="logo-gm"><g transform="translate(-6.75 -6.75) scale(.5625)"><path d="M20.62 10.84a14.15 14.15 0 0 1-4.45-3 14.11 14.11 0 0 1-3.68-6.45 .5 .5 0 0 0-.97 0 14.13 14.13 0 0 1-3.68 6.45 14.15 14.15 0 0 1-4.45 3c-.65 .28-1.32 .51-2 .68a.5 .5 0 0 0 0 .97c.68 .17 1.35 .4 2 .68a14.15 14.15 0 0 1 4.45 3 14.11 14.11 0 0 1 3.68 6.45 .5 .5 0 0 0 .97 0c.17-.69 .4-1.35 .68-2a14.14 14.14 0 0 1 3-4.45 14.11 14.11 0 0 1 6.45-3.68 .5 .5 0 0 0 0-.97 13.24 13.24 0 0 1-2-.68z" fill="#3186FF"/><path d="M20.62 10.84a14.15 14.15 0 0 1-4.45-3 14.11 14.11 0 0 1-3.68-6.45 .5 .5 0 0 0-.97 0 14.13 14.13 0 0 1-3.68 6.45 14.15 14.15 0 0 1-4.45 3c-.65 .28-1.32 .51-2 .68a.5 .5 0 0 0 0 .97c.68 .17 1.35 .4 2 .68a14.15 14.15 0 0 1 4.45 3 14.11 14.11 0 0 1 3.68 6.45 .5 .5 0 0 0 .97 0c.17-.69 .4-1.35 .68-2a14.14 14.14 0 0 1 3-4.45 14.11 14.11 0 0 1 6.45-3.68 .5 .5 0 0 0 0-.97 13.24 13.24 0 0 1-2-.68z" fill="url(#gm-grad-green)"/><path d="M20.62 10.84a14.15 14.15 0 0 1-4.45-3 14.11 14.11 0 0 1-3.68-6.45 .5 .5 0 0 0-.97 0 14.13 14.13 0 0 1-3.68 6.45 14.15 14.15 0 0 1-4.45 3c-.65 .28-1.32 .51-2 .68a.5 .5 0 0 0 0 .97c.68 .17 1.35 .4 2 .68a14.15 14.15 0 0 1 4.45 3 14.11 14.11 0 0 1 3.68 6.45 .5 .5 0 0 0 .97 0c.17-.69 .4-1.35 .68-2a14.14 14.14 0 0 1 3-4.45 14.11 14.11 0 0 1 6.45-3.68 .5 .5 0 0 0 0-.97 13.24 13.24 0 0 1-2-.68z" fill="url(#gm-grad-red)"/><path d="M20.62 10.84a14.15 14.15 0 0 1-4.45-3 14.11 14.11 0 0 1-3.68-6.45 .5 .5 0 0 0-.97 0 14.13 14.13 0 0 1-3.68 6.45 14.15 14.15 0 0 1-4.45 3c-.65 .28-1.32 .51-2 .68a.5 .5 0 0 0 0 .97c.68 .17 1.35 .4 2 .68a14.15 14.15 0 0 1 4.45 3 14.11 14.11 0 0 1 3.68 6.45 .5 .5 0 0 0 .97 0c.17-.69 .4-1.35 .68-2a14.14 14.14 0 0 1 3-4.45 14.11 14.11 0 0 1 6.45-3.68 .5 .5 0 0 0 0-.97 13.24 13.24 0 0 1-2-.68z" fill="url(#gm-grad-yellow)"/></g></g></g>
      <text x="300.48" y="202" class="term-font"><tspan fill="#38BDF8" font-weight="bold">"Gemini"] </tspan><tspan fill="#8B949E">framework = </tspan><tspan fill="#A5D6FF">["PyTorch"]</tspan></text>
    </g>
    <g class="out2c">
      <text x="24" y="226" class="term-font">
        <tspan fill="#FF7B72">  [focus]  </tspan><tspan fill="#7EE787">"Token Telemetry"</tspan><tspan fill="#484F58"> · </tspan><tspan fill="#7EE787">"Prefix Caching"</tspan><tspan fill="#484F58"> · </tspan><tspan fill="#7EE787">"Recommendation System"</tspan>
      </text>
    </g>

    <!-- Line 8: Idle prompt + clear command -->
    <g class="prompt3">
      <text x="24" y="262" class="term-font" font-weight="bold" fill="#38BDF8">❯</text>
    </g>
    <text x="40" y="262" class="term-font" fill="#E6EDF3" clip-path="url(#type3)">clear</text>

    <!-- Synchronized Tracking Block Cursor -->
    <g class="cursor-track">
      <rect width="7.5" height="15" rx="1" fill="#38BDF8" class="cursor-blink" />
    </g>
  </g>
</svg>